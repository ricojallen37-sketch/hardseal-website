<script>
(function(){
  var DEST = "/proof/ir/proof_IR_2026-05-21.html";
  try {
    var params = new URLSearchParams(window.location.search || "");
    var rawRef = params.get("ref") || "";
    var ref = rawRef.replace(/[^A-Za-z0-9_\-]/g, "").slice(0, 64);
    var qs = "p=" + encodeURIComponent("/p/ir.html") + (ref ? "&ref=" + encodeURIComponent(ref) : "");
    var beaconUrl = "/api/beacon?" + qs;
    var sent = false;
    if (navigator && typeof navigator.sendBeacon === "function") {
      sent = navigator.sendBeacon(beaconUrl);
    }
    if (!sent) {
      try { new Image().src = beaconUrl; } catch (e) { /* swallow */ }
    }
  } catch (e) { /* swallow — never block the redirect on the beacon */ }
  window.location.replace(DEST);
})();
</script>
