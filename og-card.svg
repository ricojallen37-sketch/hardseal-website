<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00FF88"/>
      <stop offset="1" stop-color="#00B864"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F0F0F" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#g)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- top eyebrow -->
  <g transform="translate(80,90)">
    <circle cx="6" cy="-1" r="6" fill="#00FF88"/>
    <text x="22" y="3" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2.5" fill="#00FF88" font-weight="700">DETERMINISTIC EVIDENCE FOR REGULATED AI</text>
  </g>

  <!-- HARDSEAL wordmark -->
  <text x="80" y="195" font-family="Inter, sans-serif" font-size="40" letter-spacing="14" fill="#FFFFFF" font-weight="800">HARDSEAL</text>

  <!-- big headline -->
  <text x="80" y="320" font-family="Inter, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-2">One packet schema.</text>
  <text x="80" y="400" font-family="Inter, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Three substrates.</text>
  <text x="80" y="475" font-family="Inter, sans-serif" font-size="76" font-weight="800" fill="#555555" letter-spacing="-2">One verifier.</text>

  <!-- bottom row -->
  <g transform="translate(80,560)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="16" fill="#888" letter-spacing="1.5">CMMC · EDGE AI · CLOUD</text>
    <text x="0" y="28" font-family="JetBrains Mono, monospace" font-size="14" fill="#555" letter-spacing="1.5">hardseal.ai · independent verification, client-side</text>
  </g>

  <!-- right-side hash decoration -->
  <g transform="translate(740, 200)" opacity="0.8">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="12" fill="#00FF88">chain_root</text>
    <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="12" fill="#888">5f2506fe f301cd9e</text>
    <text x="0" y="40" font-family="JetBrains Mono, monospace" font-size="12" fill="#888">41bc2d0c eaf57863</text>
    <text x="0" y="58" font-family="JetBrains Mono, monospace" font-size="12" fill="#888">f3ac288c 6893ff33</text>
    <text x="0" y="76" font-family="JetBrains Mono, monospace" font-size="12" fill="#888">9164b9bb f257de42</text>

    <line x1="0" y1="92" x2="280" y2="92" stroke="#1A1A1A" stroke-width="1"/>

    <text x="0" y="118" font-family="JetBrains Mono, monospace" font-size="11" fill="#555">PASS  header fields complete</text>
    <text x="0" y="135" font-family="JetBrains Mono, monospace" font-size="11" fill="#555">PASS  schema_version supported</text>
    <text x="0" y="152" font-family="JetBrains Mono, monospace" font-size="11" fill="#555">PASS  hash chain valid</text>
    <text x="0" y="169" font-family="JetBrains Mono, monospace" font-size="11" fill="#555">PASS  no banned legal language</text>

    <rect x="0" y="195" width="120" height="32" fill="rgba(0,255,136,0.15)" stroke="#00FF88" stroke-width="1"/>
    <text x="60" y="216" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#00FF88" font-weight="700">PASS</text>
  </g>
